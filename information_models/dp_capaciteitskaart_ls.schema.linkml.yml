      other:
        meaning: cim:ServiceRequestKind.other
      reconnect:
        meaning: cim:ServiceRequestKind.reconnect
      repair:
        meaning: cim:ServiceRequestKind.repair
      replace:
        meaning: cim:ServiceRequestKind.replace
      test:
